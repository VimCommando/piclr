[package]
name = "piclr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rapidly sort large folders of images with left/right actions."
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/piclr"
keywords = ["images", "sorting", "tauri", "axum", "datastar"]
categories = ["gui", "multimedia::images"]
include = [
    "src/**",
    "templates/**",
    "assets/**",
    "tauri-dist/**",
    "icons/icon.icns",
    "icons/icon.ico",
    "icons/icon.png",
    "tests/**",
    "build.rs",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "tauri.conf.json",
]

[features]
default = []
metadata = ["dep:rexiv2"]
tauri = ["dep:tauri", "dep:tauri-build", "dep:rfd"]

[dependencies]
asynk-strim = "0.1.5"
axum = "0.8"
askama = "0.12"
bytes = "1"
clap = { version = "4", features = ["derive"] }
datastar = { version = "0.3.1", features = ["axum"] }
mime = "0.3"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
urlencoding = "2"

[dependencies.tauri]
version = "2"
optional = true
features = ["macos-private-api"]

[dependencies.rfd]
version = "0.14"
optional = true

[build-dependencies]
ureq = "2"
tauri-build = { version = "2", optional = true , features = [] }

[dependencies.rexiv2]
version = "0.10"
optional = true
