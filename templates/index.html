<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>piclr</title>
        <link rel="icon" href="/favicon.ico" type="image/svg+xml" />
        <link rel="stylesheet" href="/assets/app.css" />
        <script type="module" src="/assets/datastar.js"></script>
        <script>
            (() => {
                const directorySelectionEnabled = {{ view.directory_select_enabled }};
                window.piclrInitModal = (modal) => {
                    if (!(modal instanceof HTMLElement)) return;
                    const closeButton = modal.querySelector(
                        "button[data-on\\:click*=\"/cmd/close\"]",
                    );
                    if (!(closeButton instanceof HTMLButtonElement)) return;
                    requestAnimationFrame(() => closeButton.focus({ preventScroll: true }));
                };

                window.piclrInitQueueSidebarList = (list) => {
                    if (!(list instanceof HTMLElement)) return;
                    const current = list.querySelector(".log-entry-current");
                    if (!(current instanceof HTMLElement)) return;
                    requestAnimationFrame(() => {
                        const listRect = list.getBoundingClientRect();
                        const itemRect = current.getBoundingClientRect();
                        const outsideView =
                            itemRect.top < listRect.top || itemRect.bottom > listRect.bottom;
                        if (outsideView) {
                            current.scrollIntoView({ block: "nearest", inline: "nearest" });
                        }
                    });
                };

                window.piclrInitSidebarList = (list) => {
                    if (!(list instanceof HTMLElement)) return;
                    const current = list.querySelector(".log-entry-current");
                    if (!(current instanceof HTMLElement)) return;
                    requestAnimationFrame(() =>
                        current.scrollIntoView({ block: "nearest", inline: "nearest" }),
                    );
                };

                window.piclrSelectRootDirectory = async () => {
                    if (!directorySelectionEnabled) {
                        return;
                    }
                    const tauriInvoke =
                        window.__TAURI__?.core?.invoke ||
                        window.__TAURI__?.invoke ||
                        window.__TAURI_INTERNALS__?.invoke;
                    if (typeof tauriInvoke !== "function") {
                        return;
                    }
                    let selected = null;
                    try {
                        selected = await tauriInvoke("pick_directory");
                    } catch {
                        return;
                    }
                    if (typeof selected !== "string" || selected.trim().length === 0) {
                        return;
                    }
                    await fetch("/cmd/files/root/select", {
                        method: "POST",
                        headers: { "content-type": "application/json" },
                        body: JSON.stringify({ path: selected }),
                    });
                };

                window.piclrPromptRenameDirectory = () => {
                    const nextName = window.prompt("Rename directory to:", "");
                    if (!nextName) {
                        return;
                    }
                    const signalInput = document.getElementById("directory-rename-signal");
                    if (!(signalInput instanceof HTMLInputElement)) return;
                    signalInput.value = nextName;
                    signalInput.dispatchEvent(new Event("input", { bubbles: true }));
                    signalInput.dispatchEvent(new Event("change", { bubbles: true }));
                };

                window.piclrHandleModalKeydown = (evt) => {
                    const modal = document.getElementById("modal");
                    if (!(modal instanceof HTMLElement) || modal.tagName === "MODAL-NONE") {
                        return false;
                    }
                    const buttons = Array.from(
                        modal.querySelectorAll("button:not([disabled])"),
                    );
                    if (buttons.length === 0) {
                        return false;
                    }
                    const current = document.activeElement;
                    const index = buttons.indexOf(current);

                    if (
                        evt.key === "ArrowLeft" ||
                        evt.key === "ArrowUp" ||
                        evt.key === "ArrowRight" ||
                        evt.key === "ArrowDown"
                    ) {
                        const step = evt.key === "ArrowLeft" || evt.key === "ArrowUp" ? -1 : 1;
                        const nextIndex =
                            index >= 0
                                ? (index + step + buttons.length) % buttons.length
                                : step > 0
                                  ? 0
                                  : buttons.length - 1;
                        buttons[nextIndex].focus({ preventScroll: true });
                        return true;
                    }

                    if (evt.key === "Enter") {
                        if (index >= 0) {
                            buttons[index].click();
                        } else {
                            buttons[0].focus({ preventScroll: true });
                        }
                        return true;
                    }

                    return false;
                };

                window.piclrResolveAppAction = (evt, state) => {
                    const key = evt.code || evt.key;
                    const shift = evt.shiftKey;
                    const sidebarDirBlocked =
                        state.sidebarExpanded &&
                        state.sidebarSelectedKind === "directory" &&
                        state.currentPath === "/";
                    const canPrev = !state.sidebarExpanded
                        ? state.counterImageIndex > 1
                        : state.sidebarSelectedIndex > 0;
                    const canNext = !state.sidebarExpanded
                        ? state.counterImageIndex < state.counterImageTotal
                        : state.sidebarSelectedIndex < state.sidebarListLen - 1;

                    if (shift && (key === "ArrowUp" || evt.key === "K")) return "queue-prev";
                    if (shift && (key === "ArrowDown" || evt.key === "J")) return "queue-next";
                    if (shift && (key === "ArrowLeft" || evt.key === "H") && state.queueSelected)
                        return "queue-remove-selected";
                    if (shift && (key === "ArrowRight" || evt.key === "L") && state.queueSelected)
                        return "queue-apply-selected";
                    if (key === "BracketRight" || evt.key === "]") return "jump-next";
                    if (key === "BracketLeft" || evt.key === "[") return "jump-prev";
                    if ((key === "ArrowLeft" || evt.key === "h" || evt.key === "H") && !sidebarDirBlocked)
                        return "left";
                    if (key === "ArrowRight" || evt.key === "l" || evt.key === "L") return "right";
                    if ((key === "ArrowUp" || evt.key === "k" || evt.key === "K") && canPrev)
                        return "prev";
                    if ((key === "ArrowDown" || evt.key === "j" || evt.key === "J") && canNext)
                        return "next";
                    if (key === "Home") return "home";
                    if (key === "End") return "end";
                    if (evt.key === "i" || evt.key === "I") return "toggle-sidebar";
                    if ((evt.key === "o" || evt.key === "O") && evt.ctrlKey) return "toggle-sidebar";
                    if (
                        evt.key === "Enter" &&
                        evt.ctrlKey &&
                        state.sidebarExpanded &&
                        state.sidebarSelectedKind === "directory" &&
                        !state.sidebarSelectedParent
                    )
                        return "rename-directory";
                    if (
                        evt.key === "Enter" &&
                        !evt.ctrlKey &&
                        state.sidebarExpanded &&
                        state.sidebarSelectedKind === "directory"
                    )
                        return "open-directory";
                    if (
                        evt.key === "Delete" &&
                        evt.ctrlKey &&
                        state.sidebarExpanded &&
                        state.sidebarSelectedKind === "directory" &&
                        !state.sidebarSelectedParent
                    )
                        return "delete-directory";
                    if (evt.key === "A" && shift) return "apply-request";
                    if (evt.key === "u" || evt.key === "U") return "undo";
                    if (evt.key === "q" || evt.key === "Q") return "queue-toggle";
                    if (evt.key === "?") return "help";
                    if (key === "Escape") return "close";
                    return "";
                };
            })();
        </script>
    </head>
    <body
        id="app"
        data-signals:sidebar-list-len="0"
        data-signals:sidebar-selected-index="-1"
        data-signals:sidebar-selected-kind="''"
        data-signals:sidebar-selected-parent="false"
        data-signals:queue-sidebar-visible="false"
        data-signals:queue-selected="false"
        data-signals:selected-queue-item="0"
        data-init="@get('/events', { openWhenHidden: true })"
        data-on:keydown="
            const modalHandled = window.piclrHandleModalKeydown?.(evt)
            if (modalHandled) {
                evt.preventDefault()
                evt.stopPropagation()
            } else {
                const action = window.piclrResolveAppAction?.(evt, {
                    sidebarExpanded: $sidebarExpanded,
                    sidebarSelectedKind: $sidebarSelectedKind,
                    sidebarSelectedParent: $sidebarSelectedParent,
                    sidebarSelectedIndex: $sidebarSelectedIndex,
                    sidebarListLen: $sidebarListLen,
                    currentPath: $currentPath,
                    counterImageIndex: $counterImageIndex,
                    counterImageTotal: $counterImageTotal,
                    queueSelected: $queueSelected
                }) || ''

                if (!action) {
                } else if (action === 'queue-prev') { evt.preventDefault(); @post('/cmd/queue/prev') }
                else if (action === 'queue-next') { evt.preventDefault(); @post('/cmd/queue/next') }
                else if (action === 'queue-remove-selected') { evt.preventDefault(); @post('/cmd/queue/remove-selected') }
                else if (action === 'queue-apply-selected') { evt.preventDefault(); if (window.confirm('Apply selected queued action now?')) { @post('/cmd/queue/apply-selected') } }
                else if (action === 'jump-next') { evt.preventDefault(); @post('/cmd/jump-next') }
                else if (action === 'jump-prev') { evt.preventDefault(); @post('/cmd/jump-prev') }
                else if (action === 'left') { evt.preventDefault(); @post('/cmd/left') }
                else if (action === 'right') { evt.preventDefault(); @post('/cmd/right') }
                else if (action === 'prev') { evt.preventDefault(); @post('/cmd/prev') }
                else if (action === 'next') { evt.preventDefault(); @post('/cmd/next') }
                else if (action === 'home') { evt.preventDefault(); @post('/cmd/home') }
                else if (action === 'end') { evt.preventDefault(); @post('/cmd/end') }
                else if (action === 'toggle-sidebar') { evt.preventDefault(); @post('/cmd/files/toggle') }
                else if (action === 'rename-directory') { evt.preventDefault(); window.piclrPromptRenameDirectory?.() }
                else if (action === 'open-directory') { evt.preventDefault(); @post('/cmd/files/open') }
                else if (action === 'delete-directory') { evt.preventDefault(); @post('/cmd/files/delete') }
                else if (action === 'apply-request') { evt.preventDefault(); @post('/cmd/apply/request') }
                else if (action === 'undo') { evt.preventDefault(); @post('/cmd/undo') }
                else if (action === 'queue-toggle') { evt.preventDefault(); @post('/cmd/queue/show') }
                else if (action === 'help') { evt.preventDefault(); @post('/cmd/help') }
                else if (action === 'close') { evt.preventDefault(); @post('/cmd/close') }
            }
        "
    >
        {% include "elements/modal/none.html" %}
        {% include "elements/header.html" %}
        <main-layout id="main-layout" data-class:sidebar-collapsed="!$sidebarExpanded" data-class:queue-collapsed="!$queueSidebarVisible">
            {% include "elements/sidebar.html" %}
            {% include "elements/image-viewer-empty.html" %}
            {% include "elements/queue-sidebar.html" %}
        </main-layout>
        {% include "elements/footer.html" %}
        <input
            id="directory-rename-signal"
            type="text"
            hidden
            data-bind:directory-name
            data-on:change="@patch('/cmd/files/rename')"
        />
    </body>
</html>
