<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>piclr</title>
        <link rel="stylesheet" href="/assets/app.css" />
        <script type="module" src="/assets/datastar.js"></script>
        <script>
            (() => {
                const directorySelectionEnabled = {{ view.directory_select_enabled }};
                window.piclrInitModal = (modal) => {
                    if (!(modal instanceof HTMLElement)) return;
                    const closeButton = modal.querySelector(
                        "button[data-on\\:click*=\"/cmd/close\"]",
                    );
                    if (!(closeButton instanceof HTMLButtonElement)) return;
                    requestAnimationFrame(() => closeButton.focus({ preventScroll: true }));
                };

                window.piclrInitQueueLog = (list) => {
                    if (!(list instanceof HTMLElement)) return;
                    const current = list.querySelector(".log-entry-current");
                    if (!(current instanceof HTMLElement)) return;
                    requestAnimationFrame(() => current.scrollIntoView({ block: "center" }));
                };

                const updateDirectorySignal = (directoryPath) => {
                    if (!directoryPath) return;
                    const signalInput = document.getElementById("directory-path-signal");
                    if (!(signalInput instanceof HTMLInputElement)) return;
                    signalInput.value = directoryPath;
                    signalInput.dispatchEvent(new Event("input", { bubbles: true }));
                    signalInput.dispatchEvent(new Event("change", { bubbles: true }));
                };
                window.piclrSetDirectoryPath = updateDirectorySignal;

                window.piclrOpenDirectoryPicker = async () => {
                    if (!directorySelectionEnabled) {
                        return;
                    }
                    if (window.__TAURI__?.core?.invoke) {
                        try {
                            const selectedDirectoryPath = await window.__TAURI__.core.invoke("pick_directory");
                            if (selectedDirectoryPath) {
                                void updateDirectorySignal(selectedDirectoryPath);
                            }
                            return;
                        } catch (_) {
                            return;
                        }
                    }
                    if (typeof window.showDirectoryPicker === "function") {
                        try {
                            const handle = await window.showDirectoryPicker({ mode: "read" });
                            const selectedDirectoryPath = handle?.path || handle?.fullPath || handle?.name || "";
                            if (selectedDirectoryPath) {
                                void updateDirectorySignal(selectedDirectoryPath);
                                return;
                            }
                        } catch (_) {
                            return;
                        }
                    }
                    const input = document.getElementById("directory-picker");
                    if (!(input instanceof HTMLInputElement)) return;
                    input.click();
                };
            })();
        </script>
    </head>
    <body
        id="app"
        data-init="@patch('/events', { openWhenHidden: true })"
        data-on:keydown="
            if (evt.key === 'ArrowLeft') { evt.preventDefault(); @post('/cmd/left') }
            if (evt.key === 'ArrowRight') { evt.preventDefault(); @post('/cmd/right') }
            if (evt.key === 'h' || evt.key === 'H') { evt.preventDefault(); @post('/cmd/left') }
            if (evt.key === 'l' || evt.key === 'L') { evt.preventDefault(); @post('/cmd/right') }
            if (evt.key === 'j' || evt.key === 'J') { evt.preventDefault(); @post('/cmd/next') }
            if (evt.key === 'k' || evt.key === 'K') { evt.preventDefault(); @post('/cmd/prev') }
            if (evt.key === 'ArrowUp' && evt.shiftKey) { evt.preventDefault(); @post('/cmd/jump-prev') }
            if (evt.key === 'ArrowDown' && evt.shiftKey) { evt.preventDefault(); @post('/cmd/jump-next') }
            if (evt.key === 'J' && evt.shiftKey) { evt.preventDefault(); @post('/cmd/jump-next') }
            if (evt.key === 'K' && evt.shiftKey) { evt.preventDefault(); @post('/cmd/jump-prev') }
            if (evt.key === 'ArrowUp' && !evt.shiftKey) { evt.preventDefault(); @post('/cmd/prev') }
            if (evt.key === 'ArrowDown' && !evt.shiftKey) { evt.preventDefault(); @post('/cmd/next') }
            if ((evt.key === 'o' || evt.key === 'O') && evt.ctrlKey) { evt.preventDefault(); window.piclrOpenDirectoryPicker?.() }
            if (evt.key === 'A' && evt.shiftKey) { evt.preventDefault(); @post('/cmd/apply') }
            if (evt.key === 'u' || evt.key === 'U') { evt.preventDefault(); @post('/cmd/undo') }
            if (evt.key === 'q' || evt.key === 'Q') { evt.preventDefault(); @post('/cmd/queue/show') }
            if (evt.key === 'i' || evt.key === 'I') { evt.preventDefault(); @post('/cmd/files/show') }
            if (evt.key === '?') { evt.preventDefault(); @post('/cmd/help') }
            if (evt.key === 'Escape') { evt.preventDefault(); @post('/cmd/close') }
        "
    >
            {% include "elements/modal/none.html" %}
            {% include "elements/header.html" %}
            {% include "elements/image-viewer-empty.html" %}
            {% include "elements/footer.html" %}
        <input
            id="directory-picker"
            type="file"
            webkitdirectory
            directory
            hidden
            data-on:change="
                const files = Array.from(evt.target.files || [])
                if (files.length === 0) { return }
                const first = files[0]
                let selectedDirectoryPath = ''
                if (first.path) {
                    selectedDirectoryPath = first.path.replace(/[\\\\/][^\\\\/]+$/, '')
                }
                if (!selectedDirectoryPath && first.webkitRelativePath) {
                    selectedDirectoryPath = first.webkitRelativePath.split('/')[0] || ''
                }
                if (selectedDirectoryPath) {
                    const signalInput = document.getElementById('directory-path-signal')
                    if (signalInput instanceof HTMLInputElement) {
                        signalInput.value = selectedDirectoryPath
                        signalInput.dispatchEvent(new Event('input', { bubbles: true }))
                        signalInput.dispatchEvent(new Event('change', { bubbles: true }))
                    }
                }
                evt.target.value = ''
            "
        />
        <input
            id="directory-path-signal"
            type="text"
            hidden
            data-bind:directory-path
            data-on:change="@patch('/cmd/update-directory')"
        />
    </body>
</html>
