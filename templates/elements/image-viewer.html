<image-viewer id="image-viewer">
    <click-zones>
        <click-zone
            class="left"
            data-on:click="@post('/cmd/image/left')"
        ></click-zone>
        <click-zone
            class="right"
            data-on:click="@post('/cmd/image/right')"
        ></click-zone>
    </click-zones>
    <image-stack
        id="image-stack"
        data-attr:style="'--stack-cursor:' + $stackCursor"
    ></image-stack>
</image-viewer>
