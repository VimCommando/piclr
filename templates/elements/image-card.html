<image-card
    id="image-card-{{ card.image_id }}"
    class="align-{{ card.alignment }}"
    style="--stack-index: {{ card.stack_index }};"
>
    <card-media>
        <img
            src="{{ card.image_src }}"
            alt="{{ card.action_item.file_label }}"
        />
    </card-media>
    <card-caption
        class="queue-entry queue-tone-{{ card.action_item.action_tone }}"
    >
        <span class="queue-arrow">{{ card.action_item.arrow }}</span>
        <span class="queue-action">{{ card.action_item.action_label }}</span>
        <code class="queue-file">{{ card.action_item.file_label }}</code>
    </card-caption>
</image-card>
