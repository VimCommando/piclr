<modal-queue
    id="modal"
    data-init="window.piclrInitModal?.(document.getElementById('modal'))"
    data-on:click="if (evt.target === evt.currentTarget || evt.target.tagName === 'MODAL-BACKDROP') { @post('/cmd/close') }"
>
    <modal-backdrop></modal-backdrop>
    <modal-card class="wide">
        <h2>Queued actions</h2>
        {% if view.queue_items.is_empty() %}
        <p>No queued actions.</p>
        {% else %}
        <entry-list
            id="queue-log-list"
            class="{% if view.queue_insert_at_end %}insert-end{% endif %}"
            data-init="window.piclrInitQueueLog?.(document.getElementById('queue-log-list'))"
        >
            {% for item in view.queue_items %}
            <entry-line
                class="tone-{{ item.action_tone }}{% if item.image_id == view.current_image_id %} log-entry-current{% endif %}{% if item.is_insert_before %} insert-before{% endif %}"
                data-image-id="{{ item.image_id }}"
                data-on:click="@post('/cmd/select/{{ item.image_id }}')"
            >
                <entry-status><status-glyph class="{{ item.status_kind }}"></status-glyph></entry-status>
                <entry-file>{{ item.file_label }}</entry-file>
            </entry-line>
            {% endfor %}
        </entry-list>
        {% endif %}
        <command-list>
            <button data-on:click="@post('/cmd/queue/reset')">🔄 Reset</button>
            <button data-on:click="@post('/cmd/apply')">▶️ Apply</button>
            <button autofocus data-on:click="@post('/cmd/close')">
                ✖️ Close
            </button>
        </command-list>
    </modal-card>
</modal-queue>
