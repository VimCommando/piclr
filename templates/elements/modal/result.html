<modal-result
    id="modal"
    data-init="window.piclrInitModal?.(document.getElementById('modal'))"
    data-on:click="if (evt.target === evt.currentTarget || evt.target.tagName === 'MODAL-BACKDROP') { @post('/cmd/close') }"
>
    <modal-backdrop></modal-backdrop>
    <modal-card class="wide">
        <h2>Apply Complete</h2>
        <p>{{ view.apply_completed }} of {{ view.apply_total }} actions completed successfully.</p>
        {% if view.apply_failed > 0 %}
        <p>Failed: {{ view.apply_failed }}</p>
        <queue-log class="errors">
            {% for err in view.apply_errors %}
            <queue-entry class="tone-left">
                <queue-arrow>!</queue-arrow>
                <queue-action>Error</queue-action>
                <queue-file>{{ err }}</queue-file>
            </queue-entry>
            {% endfor %}
        </queue-log>
        {% endif %}
        <modal-actions>
            <button autofocus data-on:click="@post('/cmd/close')">Close</button>
        </modal-actions>
    </modal-card>
</modal-result>
