<modal-confirm
    id="modal"
    data-init="window.piclrInitModal?.(document.getElementById('modal'))"
    data-on:click="if (evt.target === evt.currentTarget || evt.target.tagName === 'MODAL-BACKDROP') { @post('/cmd/close') }"
>
    <modal-backdrop></modal-backdrop>
    <modal-card>
        <h2>Apply queued actions?</h2>
        <p>This will apply all currently queued actions.</p>
        <command-list>
            <button autofocus data-on:click="@post('/cmd/close')">No</button>
            <button data-on:click="@post('/cmd/apply')">Yes</button>
        </command-list>
    </modal-card>
</modal-confirm>
