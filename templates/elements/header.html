<header id="header">
    <section aria-label="Directory">
        <button id="directory-select" type="button" title="Toggle sidebar" data-on:click="@post('/cmd/sidebar/toggle')">
            <glyph>📁</glyph>
        </button>
        <button data-on:click="@post('/cmd/sidebar/toggle')">
            <span data-text="$counterImageIndex"></span> /
            <span data-text="$counterImageTotal"></span>
        </button>
        <menu-item data-text="$currentPath"></menu-item>
    </section>
    <section aria-label="Left action">
        <header-title>Left</header-title>
        <action-label>{{ view.left_action_label }}</action-label>
        <header-counter data-text="$counterLeftAction"></header-counter>
    </section>
    <section aria-label="Right action">
        <header-title>Right</header-title>
        <action-label>{{ view.right_action_label }}</action-label>
        <header-counter data-text="$counterRightAction"></header-counter>
    </section>
    <section aria-label="Queue">
        <button data-on:click="@post('/cmd/queue/show')">
            <span data-text="$counterQueueCount"></span>
        </button>
        <button data-on:click="@post('/cmd/queue/show')">
            <glyph>⏸️</glyph>
        </button>
    </section>
</header>
