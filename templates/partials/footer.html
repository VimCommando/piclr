<footer id="footerbar">
    <section aria-label="App name">
        <app-title>
            <span style="color: darkred">◀</span>
            &nbsp;piclr&nbsp;
            <span style="color: royalblue">▶</span>
        </app-title>
    </section>
    <section aria-label="Commands">
        <command-list>
            <button data-on:click="@post('/cmd/left')">⬅️ Left</button>
            <button data-on:click="@post('/cmd/next')">⬇️ Next</button>
            <button data-on:click="@post('/cmd/prev')">⬆️ Prev</button>
            <button data-on:click="@post('/cmd/right')">➡️ Right</button>
            <button data-on:click="@post('/cmd/undo')">↩️ Undo</button>
            <button data-on:click="@post('/cmd/apply')">▶️ Apply</button>
            <button
                data-on:click="window.piclrOpenDirectoryPicker?.()"
                data-attr="{ disabled: !$directorySelectEnabled, 'aria-disabled': !$directorySelectEnabled }"
            >
                ⏏️ Open
            </button>
        </command-list>
    </section>
    <section aria-label="Settings">
        <button id="settings-button" type="button" title="Settings">
            <glyph>⚙️</glyph>
        </button>
    </section>
</footer>
