<div id="app" class="app">
    {% include "partials/modal_region.html" %}
    {% include "partials/action_header.html" %}
    {% include "partials/viewer_region.html" %}

    <footer class="footerbar">
        <div class="title">piclr</div>
        <div class="actions">
            <button data-on:click="@post('/cmd/left')"><span class="btn-glyph">←</span>Left</button>
            <button data-on:click="@post('/cmd/next')"><span class="btn-glyph">↓</span>Next</button>
            <button data-on:click="@post('/cmd/prev')"><span class="btn-glyph">↑</span>Prev</button>
            <button data-on:click="@post('/cmd/right')"><span class="btn-glyph">→</span>Right</button>
            <button data-on:click="@post('/cmd/undo')"><span class="btn-glyph">↶</span>Undo</button>
            <button data-on:click="@post('/cmd/apply')"><span class="btn-glyph">↩</span>Apply</button>
            <button
                {% if view.directory_select_enabled %}
                data-on:click="window.piclrOpenDirectoryPicker?.()"
                {% else %}
                disabled
                aria-disabled="true"
                {% endif %}
            >
                Select
            </button>
        </div>
        <div class="status">
            <button class="counter-button" data-on:click="@post('/cmd/show-files')">
                Image: <span data-text="$counterImageIndex"></span> / <span data-text="$counterImageTotal"></span>
            </button>
            <button class="queue-button" data-on:click="@post('/cmd/show-queue')">
                Queue: <span data-text="$counterQueueCount"></span>
            </button>
        </div>
    </footer>
    <input
        id="directory-picker"
        type="file"
        webkitdirectory
        directory
        hidden
        data-on:change="
            const files = Array.from(evt.target.files || [])
            if (files.length === 0) { return }
            const first = files[0]
            let selectedDirectoryPath = ''
            if (first.path) {
                selectedDirectoryPath = first.path.replace(/[\\\\/][^\\\\/]+$/, '')
            }
            if (!selectedDirectoryPath && first.webkitRelativePath) {
                selectedDirectoryPath = first.webkitRelativePath.split('/')[0] || ''
            }
            if (selectedDirectoryPath) {
                const signalInput = document.getElementById('directory-path-signal')
                if (signalInput instanceof HTMLInputElement) {
                    signalInput.value = selectedDirectoryPath
                    signalInput.dispatchEvent(new Event('input', { bubbles: true }))
                    signalInput.dispatchEvent(new Event('change', { bubbles: true }))
                }
            }
            evt.target.value = ''
        "
    />
    <input
        id="directory-path-signal"
        type="text"
        hidden
        data-bind:directory-path
        data-on:change="@patch('/cmd/update-directory')"
    />
</div>
